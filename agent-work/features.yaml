- epic: split-view
  title: Height-bounded dashboard layout with viewport-safe mouse mapping
  description: 'Dashboard never renders more lines than the terminal height: the session
    list scrolls in a window that follows the selection with hidden-row count indicators,
    the details/preview pane is clipped to the same budget, and the screen is cleared
    on startup so rendered line 0 sits at terminal row 1. Fixes WSL row-click misalignment
    and idle full-redraw flicker caused by content overflowing the pi-tui viewport.'
